[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siganalyzer"
version = "0.1.0"
description = "Production-quality offline standalone desktop application for RF/digital communication signal analysis"
readme = "README.md"
authors = [{ name = "SIGANALYZER Team" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "numba>=0.59.0",
    "pydantic>=2.6.0",
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "onnxruntime>=1.17.0",
    "jinja2>=3.1.3",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
siganalyzer = "siganalyzer.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
