name: Build & Release Standalone Desktop Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (defaults to pyproject.toml version)'
        required: false
        default: '0.1.0'
      dry_run:
        description: 'Dry run only (build and verify artifacts, skip draft release)'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (Python 3.12)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run full test suite
        run: |
          pytest tests/ -v

  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    needs: test
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build standalone application & DMG
        run: |
          python scripts/build_app.py

      - name: Validate macOS arm64 artifacts
        run: |
          echo "=== Validating macOS arm64 artifact integrity ==="
          test -d dist/SIGANALYZER.app || { echo "Error: dist/SIGANALYZER.app missing"; exit 1; }
          test -x dist/SIGANALYZER.app/Contents/MacOS/siganalyzer || { echo "Error: main executable missing"; exit 1; }
          
          # Architecture check
          file dist/SIGANALYZER.app/Contents/MacOS/siganalyzer | grep -q "arm64" || { echo "Error: Executable is not arm64"; exit 1; }
          
          # DMG checks
          DMG_FILE=$(find dist -maxdepth 1 -name "SIGANALYZER-*-macos-arm64.dmg")
          test -n "$DMG_FILE" || { echo "Error: DMG not found"; exit 1; }
          test -f "$DMG_FILE" || { echo "Error: DMG path invalid"; exit 1; }
          
          SIZE=$(stat -f%z "$DMG_FILE")
          test "$SIZE" -gt 10000000 || { echo "Error: DMG size unexpectedly small: $SIZE bytes"; exit 1; }
          
          # Leaks check
          if find dist/SIGANALYZER.app -name ".pytest_cache" -o -name ".venv" | grep -q .; then
            echo "Error: Dev/test artifacts leaked into bundle"; exit 1;
          fi

          # Checksum check
          test -f dist/SHA256SUMS.txt || { echo "Error: SHA256SUMS.txt missing"; exit 1; }
          shasum -a 256 -c dist/SHA256SUMS.txt || { echo "Error: SHA-256 verification failed"; exit 1; }
          echo "macOS arm64 validation passed."

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/SIGANALYZER-*-macos-arm64.dmg
            dist/SHA256SUMS.txt

  build-macos-x64:
    name: Build macOS Intel (x86_64)
    needs: test
    runs-on: macos-13
    env:
      RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build standalone application & DMG
        run: |
          python scripts/build_app.py

      - name: Validate macOS x64 artifacts
        run: |
          echo "=== Validating macOS x64 artifact integrity ==="
          test -d dist/SIGANALYZER.app || { echo "Error: dist/SIGANALYZER.app missing"; exit 1; }
          test -x dist/SIGANALYZER.app/Contents/MacOS/siganalyzer || { echo "Error: main executable missing"; exit 1; }
          
          # Architecture check
          file dist/SIGANALYZER.app/Contents/MacOS/siganalyzer | grep -q "x86_64" || { echo "Error: Executable is not x86_64"; exit 1; }
          
          # DMG checks
          DMG_FILE=$(find dist -maxdepth 1 -name "SIGANALYZER-*-macos-x64.dmg")
          test -n "$DMG_FILE" || { echo "Error: DMG not found"; exit 1; }
          test -f "$DMG_FILE" || { echo "Error: DMG path invalid"; exit 1; }
          
          SIZE=$(stat -f%z "$DMG_FILE")
          test "$SIZE" -gt 10000000 || { echo "Error: DMG size unexpectedly small: $SIZE bytes"; exit 1; }
          
          # Leaks check
          if find dist/SIGANALYZER.app -name ".pytest_cache" -o -name ".venv" | grep -q .; then
            echo "Error: Dev/test artifacts leaked into bundle"; exit 1;
          fi

          # Checksum check
          test -f dist/SHA256SUMS.txt || { echo "Error: SHA256SUMS.txt missing"; exit 1; }
          shasum -a 256 -c dist/SHA256SUMS.txt || { echo "Error: SHA-256 verification failed"; exit 1; }
          echo "macOS x64 validation passed."

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: |
            dist/SIGANALYZER-*-macos-x64.dmg
            dist/SHA256SUMS.txt

  build-windows-x64:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Program Files\Inno Setup 6") {
            "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build standalone application & Windows package
        shell: pwsh
        run: |
          python scripts/build_app.py

      - name: Validate Windows artifacts
        shell: pwsh
        run: |
          Write-Host "=== Validating Windows x64 artifact integrity ==="
          $pkg = Get-ChildItem -Path dist -Filter "SIGANALYZER-*-windows-x64.*" | Select-Object -First 1
          if (-not $pkg) {
            Write-Error "Error: Windows package not found in dist/"
            exit 1
          }
          Write-Host "Found package: $($pkg.Name) ($($pkg.Length) bytes)"
          if ($pkg.Length -lt 10000000) {
            Write-Error "Error: Package size too small: $($pkg.Length) bytes"
            exit 1
          }
          if (-not (Test-Path dist/SHA256SUMS.txt)) {
            Write-Error "Error: dist/SHA256SUMS.txt missing"
            exit 1
          }
          $expectedHash = (Get-FileHash -Path $pkg.FullName -Algorithm SHA256).Hash.ToLower()
          $manifestContent = Get-Content dist/SHA256SUMS.txt -Raw
          if (-not $manifestContent.Contains($expectedHash)) {
            Write-Error "Error: Checksum in manifest does not match actual file hash"
            exit 1
          }
          Write-Host "Windows x64 validation passed."

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/SIGANALYZER-*-windows-x64.*
            dist/SHA256SUMS.txt

  build-linux-x64:
    name: Build Linux (x86_64)
    needs: test
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system Qt/X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-glx \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build standalone application & Linux package
        run: |
          python scripts/build_app.py

      - name: Validate Linux artifacts
        run: |
          echo "=== Validating Linux x64 artifact integrity ==="
          TARBALL=$(find dist -maxdepth 1 -name "SIGANALYZER-*-linux-x64.tar.gz")
          test -n "$TARBALL" || { echo "Error: Linux tarball not found"; exit 1; }
          test -f "$TARBALL" || { echo "Error: Linux tarball path invalid"; exit 1; }

          SIZE=$(stat -c%s "$TARBALL")
          test "$SIZE" -gt 10000000 || { echo "Error: Tarball size unexpectedly small: $SIZE bytes"; exit 1; }

          # Check archive contents
          tar -tzf "$TARBALL" | grep -q "siganalyzer" || { echo "Error: Tarball missing siganalyzer binary"; exit 1; }

          # Checksum check
          test -f dist/SHA256SUMS.txt || { echo "Error: SHA256SUMS.txt missing"; exit 1; }
          sha256sum -c dist/SHA256SUMS.txt || { echo "Error: SHA-256 verification failed"; exit 1; }
          echo "Linux x64 validation passed."

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/SIGANALYZER-*-linux-x64.*
            dist/SHA256SUMS.txt

  verify-and-aggregate:
    name: Verify & Aggregate Release Artifacts
    needs: [test, build-macos-arm64, build-macos-x64, build-windows-x64, build-linux-x64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Aggregate artifacts and compute master SHA256SUMS.txt
        run: |
          mkdir -p dist-all
          echo "=== Aggregating distributable desktop binaries ==="
          
          # Copy only valid binary distributions (skip intermediate SHA256SUMS files)
          find downloaded-artifacts -type f \( -name "SIGANALYZER-*.dmg" -o -name "SIGANALYZER-*.exe" -o -name "SIGANALYZER-*.tar.gz" -o -name "SIGANALYZER-*.AppImage" -o -name "SIGANALYZER-*.zip" \) -exec cp {} dist-all/ \;

          echo "Distributable artifacts in dist-all/:"
          ls -la dist-all/

          # Strict desktop platform validation
          echo "=== Checking all required desktop targets ==="
          ls dist-all/SIGANALYZER-*-macos-arm64.dmg || { echo "Error: Missing macOS arm64 DMG"; exit 1; }
          ls dist-all/SIGANALYZER-*-macos-x64.dmg || { echo "Error: Missing macOS x64 DMG"; exit 1; }
          ls dist-all/SIGANALYZER-*-windows-x64.* || { echo "Error: Missing Windows x64 binary"; exit 1; }
          ls dist-all/SIGANALYZER-*-linux-x64.tar.gz || { echo "Error: Missing Linux x64 tarball"; exit 1; }

          # Prohibited files verification (mobile, source archives, debug symbols)
          if ls dist-all/*.apk dist-all/*.ipa dist-all/*source*.zip dist-all/*source*.tar.gz dist-all/*.pdb dist-all/*.dsym 2>/dev/null; then
            echo "Error: Forbidden file types detected in release aggregation!"; exit 1;
          fi

          # Generate unified genuine SHA256SUMS.txt
          cd dist-all
          sha256sum SIGANALYZER-* > SHA256SUMS.txt
          
          echo "=== Master SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

          echo "=== Verifying all checksums ==="
          sha256sum -c SHA256SUMS.txt
          echo "Checksum verification complete and 100% verified."

      - name: Upload unified release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: SIGANALYZER-release-bundle
          path: |
            dist-all/SIGANALYZER-*
            dist-all/SHA256SUMS.txt

      - name: Create Draft GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            dist-all/SIGANALYZER-*
            dist-all/SHA256SUMS.txt
