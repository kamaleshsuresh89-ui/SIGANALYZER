<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark background plate -->
  <rect width="64" height="64" rx="14" fill="#070a10" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle technical grid -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- RF Waveform / Spectrum Peaks -->
  <path d="M10 38 L20 38 L26 18 L32 46 L38 24 L44 40 L54 40" 
        stroke="url(#cyanGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- In-Phase / Quadrature sync dots -->
  <circle cx="26" cy="18" r="2" fill="#00f0ff" />
  <circle cx="38" cy="24" r="2" fill="#10b981" />
  <circle cx="32" cy="46" r="2" fill="#f59e0b" />
</svg>
